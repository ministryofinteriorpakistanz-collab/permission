<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry of Interior Pakistan - Black Tinted Permit Verification</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for typography matching -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;700&family=Times+New+Roman&display=swap" rel="stylesheet">
    <style>
        .font-serif-official {
            font-family: 'Times New Roman', Times, serif;
        }
        .font-cinzel {
            font-family: 'Cinzel', Georgia, serif;
        }
    </style>
</head>
<body class="bg-white text-gray-900 font-sans min-h-screen flex flex-col items-center justify-start p-4 md:p-8">

    <!-- Container for mobile-first centered layout -->
    <div class="w-full max-w-md mx-auto flex flex-col items-center text-center space-y-6">

        <!-- Header / Logo Section -->
        <header class="flex items-center justify-center space-x-3 w-full pt-2 pb-4">
            <!-- Official Pakistan Emblem SVG -->
            <svg class="w-16 h-16 md:w-20 md:h-20 text-emerald-800 flex-shrink-0" viewBox="0 0 100 100" fill="currentColor">
                <!-- Outer Crescent & Star -->
                <path d="M50 5 C25 5 5 25 5 50 C5 75 25 95 50 95 C68 95 83 84 90 68 C82 74 72 77 60 75 C40 72 25 55 25 35 C25 22 32 10 44 5 C46 5 48 5 50 5 Z" fill="#047857" opacity="0.15"/>
                <!-- Shield Contour -->
                <path d="M30 25 L70 25 L70 55 C70 70 50 82 50 82 C50 82 30 70 30 55 Z" fill="none" stroke="#047857" stroke-width="3"/>
                <!-- Quarter Division Lines -->
                <line x1="50" y1="25" x2="50" y2="78" stroke="#047857" stroke-width="2"/>
                <line x1="30" y1="45" x2="70" y2="45" stroke="#047857" stroke-width="2"/>
                <!-- Quarter Icons (Simplified) -->
                <!-- Top-Left: Tea Plant / Cotton -->
                <circle cx="40" cy="35" r="4" fill="#047857"/>
                <!-- Top-Right: Wheat -->
                <path d="M58 32 L62 38 M58 38 L62 32" stroke="#047857" stroke-width="2"/>
                <!-- Bottom-Left: Jute -->
                <path d="M38 52 L42 58 M38 58 L42 52" stroke="#047857" stroke-width="2"/>
                <!-- Bottom-Right: Jasmine -->
                <circle cx="60" cy="55" r="3" fill="#047857"/>
                <!-- Surrounding Wreath -->
                <path d="M20 50 C20 70 35 85 50 88 C65 85 80 70 80 50" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="4,3"/>
                <!-- Ribbon Scroll at Bottom -->
                <path d="M25 85 Q50 92 75 85 Q65 95 50 93 Q35 95 25 85 Z" fill="#047857"/>
                <!-- Star and Crescent Top -->
                <path d="M50 10 A 5 5 0 0 1 55 15 A 5 5 0 0 1 50 20 A 5 5 0 0 1 45 15 A 5 5 0 0 1 50 10 Z" fill="#047857"/>
            </svg>

            <!-- Ministry Text Block -->
            <div class="text-left font-sans">
                <h1 class="text-blue-900 font-bold text-lg md:text-xl leading-tight">
                    Ministry of Interior
                </h1>
                <p class="text-blue-800 text-sm md:text-base font-medium">
                    Government of Pakistan
                </p>
            </div>
        </header>

        <!-- Red / Maroon Navigation Links Text -->
        <div class="text-red-800 font-semibold text-xs md:text-sm tracking-wide uppercase pt-2">
            DRIVING LICENSE VERIFICATION · VEHICLES VERIFICATION
        </div>

        <!-- Main Heading with Horizontal Line -->
        <div class="w-full flex flex-col items-center pt-4">
            <h2 class="text-gray-900 font-serif-official text-xl md:text-2xl font-normal tracking-wide uppercase">
                MINISTRY OF INTERIOR PAKISTAN
            </h2>
            <div class="w-10 h-[1.5px] bg-gray-800 mt-2"></div>
        </div>

        <!-- Subheading -->
        <div class="pt-2">
            <h3 class="text-black font-sans font-bold italic text-lg md:text-xl">
                Black Tinted Permit Verification
            </h3>
        </div>

        <!-- Central Crest with Verified Shield Badge -->
        <div class="relative w-64 h-64 md:w-72 md:h-72 flex items-center justify-center my-4">
            <!-- Background Light Floral/Wreath Crest -->
            <div class="absolute inset-0 flex items-center justify-center opacity-30">
                <svg class="w-full h-full text-emerald-600" viewBox="0 0 200 200" fill="currentColor">
                    <!-- Crescent Moon Top -->
                    <path d="M100 15 C85 15 72 23 65 35 C75 30 88 32 95 40 C102 48 102 60 95 70 C110 65 120 50 115 35 C110 22 98 15 100 15 Z"/>
                    <!-- Star Top Right -->
                    <polygon points="125,25 128,32 135,33 130,38 131,45 125,41 119,45 120,38 115,33 122,32"/>
                    <!-- Leafy Crest Wreath Border Left -->
                    <path d="M40 90 Q30 130 65 160 Q80 172 100 175" stroke="currentColor" stroke-width="4" fill="none"/>
                    <path d="M35 80 Q25 90 30 100" stroke="currentColor" stroke-width="3" fill="none"/>
                    <path d="M30 105 Q20 115 28 125" stroke="currentColor" stroke-width="3" fill="none"/>
                    <path d="M32 130 Q25 145 42 152" stroke="currentColor" stroke-width="3" fill="none"/>
                    <!-- Leafy Crest Wreath Border Right -->
                    <path d="M160 90 Q170 130 135 160 Q120 172 100 175" stroke="currentColor" stroke-width="4" fill="none"/>
                    <path d="M165 80 Q175 90 170 100" stroke="currentColor" stroke-width="3" fill="none"/>
                    <path d="M170 105 Q180 115 172 125" stroke="currentColor" stroke-width="3" fill="none"/>
                    <path d="M168 130 Q175 145 158 152" stroke="currentColor" stroke-width="3" fill="none"/>
                    <!-- Urdu Ribbon at Bottom -->
                    <path d="M50 165 C70 180 130 180 150 165 C140 190 60 190 50 165 Z" fill="currentColor" opacity="0.6"/>
                    <!-- Urdu Script Text Mock Placeholder -->
                    <text x="100" y="178" text-anchor="middle" font-size="12" fill="white" font-weight="bold">ایمان اتحاد تنظیم</text>
                </svg>
            </div>

            <!-- Solid Green Shield with White Checkmark -->
            <div class="relative z-10 w-36 h-44 md:w-40 md:h-48 drop-shadow-md flex items-center justify-center">
                <svg class="w-full h-full text-emerald-600" viewBox="0 0 100 120" fill="currentColor">
                    <!-- Shield Base Path -->
                    <path d="M50 5 L90 20 V60 C90 90 50 112 50 112 C50 112 10 90 10 60 V20 Z" />
                    <!-- Checkmark (White with subtle inner pattern detail) -->
                    <path d="M32 58 L45 72 L70 42" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <!-- Bottom Status Text -->
        <div class="pt-2 pb-8">
            <h4 class="text-black font-sans font-bold text-2xl md:text-3xl underline underline-offset-4 decoration-2">
                Verified:
            </h4>
        </div>

    </div>

</body>
</html>
